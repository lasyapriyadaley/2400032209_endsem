
services:

  app-db:
    image: mysql:8.0
    container_name: app-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: appdb
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  app-service:
    build: .
    container_name: app-service
    ports:
      - "8080:8080"
    depends_on:
      app-db:
        condition: service_healthy

volumes:
  mysql-data:
